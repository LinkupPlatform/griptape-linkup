[project]
name = "griptape-linkup"
version = "0.1.0"
description = "Griptape extension for the Linkup web search API"
authors = [{ name = "Linkup", email = "contact@linkup.so" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["griptape", "linkup", "search", "web-search", "ai-agents"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["griptape>=1.3.0", "linkup-sdk>=0.23.0"]

[project.urls]
Homepage = "https://www.linkup.so"
Documentation = "https://docs.linkup.so"
Repository = "https://github.com/LinkupPlatform/griptape-linkup"
Issues = "https://github.com/LinkupPlatform/griptape-linkup/issues"

[dependency-groups]
test = ["pytest>=8.3.1", "pytest-mock>=3.14.0"]
dev = ["pre-commit>=4.0.0", "pyright>=1.1.390", "ruff>=0.8.0", "typos>=1.28.0"]

[tool.uv]
exclude-newer = "2 weeks"
default-groups = ["dev", "test"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `griptape/__init__.py` belongs to the core `griptape` distribution, so only the
# `griptape.linkup` namespace is shipped in the wheel.
[tool.hatch.build.targets.wheel]
only-include = ["griptape/linkup"]

[tool.hatch.build.targets.sdist]
include = ["griptape", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "S", "UP", "B"]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["griptape"]
exclude = ["**/__pycache__"]
pythonVersion = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
